config:
  default_byte_order: LE
  buffer_address_type: u8
  register_address_type: u8
  defmt_feature: "defmt-03"

chip_id:
  type: register
  address: 0x00
  access: RO
  size_bits: 8
  description: Chip identification code
  fields:
    chip_id:
      base: uint
      start: 0
      end: 8
      description: Should be value 0x24

err_reg:
  type: register
  address: 0x02
  access: RO
  size_bits: 8
  description: Reports sensor error conditions
  fields:
    fatal_err:
      base: bool
      start: 0
      description: |
        Fatal Error, chip is not in operational state (Boot-,
        power-system). This flag will be reset only by power-
        on-reset or softreset.
    internal_err:
      base: uint
      start: 1
      end: 4
      description: Internal error, please contact your Bosch Sensortec regional support team.
    fifo_err:
      base: bool
      start: 6
      description: |
        Error when a frame is read in streaming mode (so
        skipping is not possible) and fifo is overfilled (with
        virtual and/or regular frames). This flag will be reset
        when read.
    aux_err:
      base: bool
      start: 7
      description: Error in I2C-Master detected. This flag will be reset when read.

status:
  type: register
  address: 0x03
  access: RO
  size_bits: 8
  description: Sensor status flags
  fields:
    aux_busy:
      base: bool
      start: 2
      description: |
        '1'('0') indicate a (no) Auxiliary sensor interface operation
        is ongoing triggered via AUX_RD_ADDR,
        AUX_WR_ADDR or from FCU.
    cmd_rdy:
      base: bool
      start: 4
      description: |
        CMD decoder status. '0' -> Command in progress '1' ->
        Command decoder is ready to accept a new command
    drdy_aux:
      base: bool
      start: 5
      description: |
        Data ready for Auxiliary sensor. It gets reset, when one
        Auxiliary sensor DATA register is read out
    drdy_gyr:
      base: bool
      start: 6
      description: |
        Data ready for Gyroscope. It gets reset, when one
        Gyroscope DATA register is read out
    drdy_acc:
      base: bool
      start: 7
      description: |
        Data ready for Accelerometer. It gets reset, when one
        Accelerometer DATA register is read out

aux:
  type: register
  address: 0x04
  access: RO
  size_bits: 48
  description: Auxiliary sensor data
  fields:
    x:
      base: int
      start: 0
      end: 16
    y:
      base: int
      start: 16
      end: 32
    z:
      base: int
      start: 32
      end: 48

acc:
  type: register
  address: 0x0C
  access: RO
  size_bits: 48
  description: Accelerometer data
  fields:
    x:
      base: int
      start: 0
      end: 16
    y:
      base: int
      start: 16
      end: 32
    z:
      base: int
      start: 32
      end: 48

gyr:
  type: register
  address: 0x12
  access: RO
  size_bits: 48
  description: Gyroscope data
  fields:
    x:
      base: int
      start: 0
      end: 16
    y:
      base: int
      start: 16
      end: 32
    z:
      base: int
      start: 32
      end: 48

sensor_time:
  type: register
  address: 0x18
  access: RO
  size_bits: 24
  description: Sensor Time
  fields:
    sensor_time:
      base: uint
      start: 0
      end: 24

event:
  type: register
  address: 0x1B
  access: RO
  size_bits: 8
  description: Sensor event flags. Will be cleared on read when bit 0 is sent out over the bus.
  fields:
    por_detected:
      base: bool
      start: 0
    error_code:
      base: uint
      start: 2
      end: 4
      conversion:
        name: ErrorCode
        no_error:
          value: 0x00
          description: No error is reported
        acc_err:
          value: 0x01
          description: Error in Register ACC_CONF
        gyr_err:
          value: 0x02
          description: Error in Register GYR_CONF
        acc_and_gyr_err:
          value: 0x03
          description: Error in Registers ACC_GYR & GYR_CONF

int_status_0:
  type: register
  address: 0x1C
  access: RO
  size_bits: 8
  description: Interrupt/Feature Status. Will be cleared on read.
  fields:
    sig_motion_out:
      base: bool
      start: 0
      description: Sigmotion output
    step_counter_out:
      base: bool
      start: 1
      description: Step-counter watermark or Step-detector output
    activity_out:
      base: bool
      start: 2
      description: Step activity output
    wrist_wear_wakeup_out:
      base: bool
      start: 3
      description: Wrist wear wakeup output
    wrist_gesture_out:
      base: bool
      start: 4
      description: Wrist gesture output
    no_motion_out:
      base: bool
      start: 5
      description: No motion detection output
    any_motion_out:
      base: bool
      start: 6
      description: Any motion detection output

int_status_1:
  type: register
  address: 0x1D
  access: RW
  size_bits: 8
  description: Interrupt Status 1. Will be cleared on read when bit 0 is sent out over the bus.
  fields:
    ffull_int:
      base: bool
      start: 0
      description: FIFO Full Interrupt
    fwm_int:
      base: bool
      start: 1
      description: FIFO Watermark Interrupt
    err_int:
      base: bool
      start: 2
      description: ERROR Interrupt
    aux_drdy_int:
      base: bool
      start: 5
      description: Auxiliary Data Ready Interrupt
    gyr_drdy_int:
      base: bool
      start: 6
      description: Gyroscope Data Ready Interrupt
    acc_drdy_int:
      base: bool
      start: 7
      description: Accelerometer Data Ready Interrupt

sc_out:
  type: register
  address: 0x1E
  access: RO
  size_bits: 16
  description: Step counting value
  fields:
    step_count:
      base: uint
      start: 0
      end: 16
      description: Step counter output value

wr_gest_act:
  type: register
  address: 0x20
  access: RO
  size_bits: 8
  description: Wrist gesture and activity detection output
  fields:
    wr_gest_out:
      base: uint
      start: 0
      end: 3
      description: |
        Output value of the wrist gesture detection
        feature. Value after device initialization is 0b00
        i.e. unknown gesture
      try_conversion:
        name: WristGesture
        unknown_gesture:
          value: 0x00
          description: Unknown gesture
        push_arm_down:
          value: 0x01
          description: Push arm down gesture
        pivot_up:
          value: 0x02
          description: Pivot up gesture
        wrist_shake_jiggle:
          value: 0x03
          description: Wrist shake/jiggle gesture
        flick_in:
          value: 0x04
          description: Arm flick in gesture
        flick_out:
          value: 0x05
          description: Arm flick out gesture
    act_out:
      base: uint
      start: 3
      end: 5
      description: |
        Output value of the activity detection feature.
        Value after device initialization is 0b11 i.e.
        unknown activity
      conversion:
        name: ActivityDetection
        still:
          value: 0x00
          description: User stationary
        walking:
          value: 0x01
          description: User walking
        running:
          value: 0x02
          description: User running
        unknown:
          value: 0x03
          description: Unknown state

internal_status:
  type: register
  address: 0x21
  access: RO
  size_bits: 8
  description: Error bits and message indicating internal status
  fields:
    message:
      base: uint
      start: 0
      end: 3
      description: Internal Status Message
      conversion:
        name: StatusMessage
        not_init:
          value: 0x00
          description: ASIC is not initialized
        init_ok:
          value: 0x01
          description: ASIC initialized
        init_err:
          value: 0x02
          description: Initialization error
        drv_err:
          value: 0x03
          description: Invalid driver
        sns_stop:
          value: 0x04
          description: Sensor stopped
        nvm_error:
          value: 0x05
          description: Internal error while accessing NVM
        start_up_error:
          value: 0x06
          description: Internal error while accessing NVM and Initialization error
        compat_error:
          value: 0x07
          description: Compatibility error
    axes_remap_error:
      base: bool
      start: 5
    odr_50hz_error:
      base: bool
      start: 6

temperature:
  type: register
  address: 0x22
  access: RO
  size_bits: 16
  description: |
    Temperature data

    The temperature is disabled when all sensors are in suspend. The output word of
    the 16-bit temperature sensor is valid if the Gyroscope is in normal mode, i.e. gyr_pmu_status=1.
    The resolution is 1/2^9 K/LSB. The absolute accuracy of the temperature is in the order of:
    * 0x7FFF -> 87-1/2^9 °C
    * 0x0000 -> 23°C
    * 0x8001 -> -41+1/2^9 °C
    * 0x8000 -> invalid
    If the Gyroscope is in normal mode (see register PMU_STATUS), the temperature is updated every 10 ms (+-
    12%), if the gyroscope is in standby mode or fast-power up mode, the temperature is updated ever 1.28 s aligned with
    bit 15 of the register SENSORTIME.
  fields:
    data:
      base: uint
      start: 0
      end: 16

fifo_length:
  type: register
  address: 0x24
  access: RO
  size_bits: 14
  fields:
    fifo_length:
      base: uint
      start: 0
      end: 14
      description: Should be value 0x24

fifo_data:
  type: buffer
  address: 0x26
  access: RW
  description: FIFO_DATA register

any_motion1:
  type: register
  address: 0x3C
  access: RW
  size_bits: 16
  reset_value: 0xE005
  description: Any-motion detection general configuration flags - part 1
  fields:
    duration:
      base: uint
      start: 0
      end: 13
    select_x:
      base: bool
      start: 13
    select_y:
      base: bool
      start: 14
    select_z:
      base: bool
      start: 15
any_motion2:
  type: register
  address: 0x3E
  access: RW
  size_bits: 16
  reset_value: 0x38AA
  description: Any-motion detection general configuration flags - part 2
  fields:
    threshold:
      base: uint
      start: 0
      end: 11
    out_conf:
      base: uint
      start: 11
      end: 15
    enable:
      base: bool
      start: 15
      description: Enables the feature

acc_conf:
  type: register
  address: 0x40
  access: RW
  size_bits: 8
  description: Power mode control register
  fields:
    acc_odr:
      base: uint
      start: 0
      end: 4
      description: |
        ODR in Hz. The output data rate is independent of
        the power mode setting for the sensor
      try_conversion:
        name: acc_odr
        odr_0p78:
          value: 0x01
          description: 25/32Hz
        odr_1p5:
          value: 0x02
          description: 25/16Hz
        odr_3p1:
          value: 0x03
          description: 25/8Hz
        odr_6p25:
          value: 0x04
          description: 25/4Hz
        odr_12p5:
          value: 0x05
          description: 25/2Hz
        odr_25:
          value: 0x06
          description: 25Hz
        odr_50:
          value: 0x07
          description: 50Hz
        odr_100:
          value: 0x08
          description: 100Hz
          default:
        odr_200:
          value: 0x09
          description: 200Hz
        odr_400:
          value: 0x0a
          description: 400Hz
        odr_800:
          value: 0x0b
          description: 800Hz
        odr_1k6:
          value: 0x0c
          description: 1600Hz
    acc_bwp:
      base: uint
      start: 4
      end: 7
      description: |
        Bandwidth parameter determines filter configuration
        (acc_filt_perf=1) and averaging for undersampling
        mode (acc_filt_perf=0)
      conversion:
        name: acc_bwp
        osr4_avg1:
          value: 0x00
          description: acc_filt_perf = 1 -> OSR4 mode; acc_filt_perf = 0 -> no averaging
        osr2_avg2:
          value: 0x01
          description: acc_filt_perf = 1 -> OSR2 mode; acc_filt_perf = 0 -> average 2 samples
        norm_avg4:
          value: 0x02
          description: acc_filt_perf = 1 -> normal mode; acc_filt_perf = 0 -> average 4 samples
        cic_avg8:
          value: 0x03
          description: acc_filt_perf = 1 -> CIC mode; acc_filt_perf = 0 -> average 8 samples
        res_avg16:
          value: 0x04
          description: acc_filt_perf = 1 -> Reserved; acc_filt_perf = 0 -> average 16 samples
        res_avg32:
          value: 0x05
          description: acc_filt_perf = 1 -> Reserved; acc_filt_perf = 0 -> average 32 samples
        res_avg64:
          value: 0x06
          description: acc_filt_perf = 1 -> Reserved; acc_filt_perf = 0 -> average 64 samples
        res_avg128:
          value: 0x07
          description: acc_filt_perf = 1 -> Reserved; acc_filt_perf = 0 -> average 128 samples
    acc_filter_perf:
      base: uint
      start: 7
      end: 8
      description: Select accelerometer filter performance mode
      conversion:
        name: acc_filter_perf
        ulp:
          value: 0x00
          description: Power optimized
        hlp:
          value: 0x01
          description: Performance opt.

acc_range:
  type: register
  address: 0x41
  access: RW
  size_bits: 8
  description: Selection of the Accelerometer g-range
  fields:
    range_2g:
      base: uint
      start: 0
      end: 2
      description: Accelerometer g-range
      conversion:
        name: acc_range
        range_2g:
          value: 0x00
          description: +/-2g
        range_4g:
          value: 0x01
          description: +/-2g
        range_8g:
          value: 0x02
          description: +/-4g
        range_16g:
          value: 0x03
          description: +/-16g

gyr_conf:
  type: register
  address: 0x42
  access: RW
  size_bits: 8
  reset_value: 0xA9
  description: Sets the output data rate and the bandwidth of the Gyroscope
  fields:
    gyr_odr:
      base: uint
      start: 0
      end: 4
      description: ODR in Hz
      try_conversion:
        name: gyr_odr
        odr_25:
          value: 0x06
          description: 25Hz
        odr_50:
          value: 0x07
          description: 50Hz
        odr_100:
          value: 0x08
          description: 100Hz
          default:
        odr_200:
          value: 0x09
          description: 200Hz
        odr_400:
          value: 0x0A
          description: 400Hz
        odr_800:
          value: 0x0B
          description: 800Hz
        odr_1k6:
          value: 0x0C
          description: 1600Hz
        odr_3k2:
          value: 0x0D
          description: 3200Hz
    gyr_bwp:
      base: uint
      start: 4
      end: 6
      description: Gyroscope bandwidth coefficient
      conversion:
        name: gyr_bwp
        osr4:
          value: 0x00
          description: OSR4 mode
        osr2:
          value: 0x01
          description: OSR2 mode
        norm:
          value: 0x02
          description: Normal mode
        res:
          value: 0x03
          description: Reserved
    gyr_noise_perf:
      base: uint
      start: 6
      end: 7
      description: Select noise performance
      conversion:
        name: gyr_noise_perf
        ulp:
          value: 0x00
          description: Power optimized
        hp:
          value: 0x01
          description: Performance optimized
    gyr_filter_perf:
      base: uint
      start: 7
      end: 8
      description: Select gyroscope filter performance mode
      conversion:
        name: gyr_filter_perf
        ulp:
          value: 0x00
          description: Power optimized
        hp:
          value: 0x01
          description: Performance optimized

gyr_range:
  type: register
  address: 0x43
  access: RW
  size_bits: 8
  description: Defines the Gyroscope angular rate measurement range
  fields:
    gyr_range:
      base: uint
      start: 0
      end: 3
      description: Full scale for filtered FIFO data and DATA registers
      try_conversion:
        name: gyr_range
        range_2000:
          value: 0x00
          description: +/-2000dps, 16.4 LSB/dps
        range_1000:
          value: 0x01
          description: +/-1000dps, 32.8 LSB/dps
        range_500:
          value: 0x02
          description: +/-500dps, 65.6 LSB/dps
        range_250:
          value: 0x03
          description: +/-250dps, 131.2 LSB/dps
        range_125:
          value: 0x04
          description: +/-125dps, 262.4 LSB/dps
    ois_range:
      base: uint
      start: 3
      end: 4
      description: Full scale for pre-filtered FIFO data and OIS data
      conversion:
        name: ois_range
        range_250:
          value: 0x00
          description: +/-250dps, 131.2 LSB/dps
        range_2000:
          value: 0x01
          description: +/-2000dps, 16.4 LSB/dps

aux_conf:
  type: register
  address: 0x44
  access: RW
  size_bits: 8
  reset_value: 0x46
  description: Sets the output data rate of the Auxiliary sensor interface
  fields:
    aux_odr:
      base: uint
      start: 0
      end: 4
      description: Poll rate for the magnetometer attached to the Auxiliary sensor interface
      try_conversion:
        name: aux_odr
        odr_0p78:
          value: 0x01
          description: 25/32Hz
        odr_1p5:
          value: 0x02
          description: 25/16Hz
        odr_3p1:
          value: 0x03
          description: 25/8Hz
        odr_6p25:
          value: 0x04
          description: 25/4Hz
        odr_12p5:
          value: 0x05
          description: 25/2Hz
        odr_25:
          value: 0x06
          description: 25Hz
        odr_50:
          value: 0x07
          description: 50Hz
        odr_100:
          value: 0x08
          description: 100Hz
        odr_200:
          value: 0x09
          description: 200Hz
        odr_400:
          value: 0x0A
          description: 400Hz
        odr_800:
          value: 0x0B
          description: 800Hz
    aux_offset:
      base: uint
      start: 4
      end: 8
      description: Trigger-readout offset in units of 2.5ms

fifo_downs:
  type: register
  address: 0x45
  access: RW
  size_bits: 8
  reset_value: 0x88
  description: Configure Gyroscope and Accelerometer downsampling rates for FIFO
  fields:
    gyr_fifo_downs:
      base: uint
      start: 0
      end: 3
      description: Downsampling for Gyroscope (2**downs_gyro)
    gyr_fifo_filt_data:
      base: uint
      start: 3
      end: 4
      description: Selects filtered or unfiltered Gyroscope data for FIFO
      conversion:
        name: fifo_filt_data
        unfiltered:
          value: 0x00
          description: Unfiltered data
        filtered:
          value: 0x01
          description: Filtered data
    acc_fifo_downs:
      base: uint
      start: 4
      end: 7
      description: Downsampling for Accelerometer (2**downs_accel)
    acc_fifo_filt_data:
      base: uint
      start: 7
      end: 8
      description: Selects filtered or unfiltered Accelerometer data for FIFO
      conversion:
        name: acc_fifo_filt_data
        unfiltered:
          value: 0x00
          description: Unfiltered data
        filtered:
          value: 0x01
          description: Filtered data

fifo_wtm_0:
  type: register
  address: 0x46
  access: RW
  size_bits: 8
  description: FIFO Watermark level LSB
  fields:
    fifo_water_mark_7_0:
      base: uint
      start: 0
      end: 8
      description: Trigger interrupt when FIFO contains fifo_water_mark_7_0 + fifo_water_mark_12_8 * 256 bytes

fifo_wtm_1:
  type: register
  address: 0x47
  access: RW
  size_bits: 8
  reset_value: 0x02
  description: FIFO Watermark level MSB
  fields:
    fifo_water_mark_12_8:
      base: uint
      start: 0
      end: 5
      description: Trigger interrupt when FIFO contains fifo_water_mark_7_0 + fifo_water_mark_12_8 * 256 bytes

fifo_config_0:
  type: register
  address: 0x48
  access: RW
  size_bits: 8
  reset_value: 0x02
  description: FIFO frame content configuration
  fields:
    fifo_stop_on_full:
      base: bool
      start: 0
      description: Stop writing samples into FIFO when FIFO is full
    fifo_time_en:
      base: bool
      start: 1
      description: Return sensortime frame after the last valid data frame

fifo_config_1:
  type: register
  address: 0x49
  access: RW
  size_bits: 8
  reset_value: 0x10
  description: FIFO frame content configuration
  fields:
    fifo_tag_int1_en:
      base: uint
      start: 0
      end: 2
      description: FIFO interrupt 1 tag enable
    fifo_tag_int2_en:
      base: uint
      start: 2
      end: 4
      description: FIFO interrupt 2 tag enable
    fifo_header_en:
      base: bool
      start: 4
    fifo_aux_en:
      base: bool
      start: 5
    fifo_acc_en:
      base: bool
      start: 6
    fifo_gyr_en:
      base: bool
      start: 7

saturation:
  type: register
  address: 0x4A
  access: RO
  size_bits: 8
  description: Contains information if raw data samples have been saturated
  fields:
    acc_x:
      base: bool
      start: 0
      description: ACC X-axis raw data saturation flag
    acc_y:
      base: bool
      start: 1
      description: ACC Y-axis raw data saturation flag
    acc_z:
      base: bool
      start: 2
      description: ACC Z-axis raw data saturation flag
    gyr_x:
      base: bool
      start: 3
      description: GYR X-axis raw data saturation flag
    gyr_y:
      base: bool
      start: 4
      description: GYR Y-axis raw data saturation flag
    gyr_z:
      base: bool
      start: 5
      description: GYR Z-axis raw data saturation flag

aux_dev_id:
  type: register
  address: 0x4B
  access: RW
  size_bits: 8
  reset_value: 0x20
  description: Auxiliary interface device_id
  fields:
    i2c_device_addr:
      base: uint
      start: 1
      end: 8
      description: I2C device address of Auxiliary sensor

aux_if_conf:
  type: register
  address: 0x4C
  access: RW
  size_bits: 8
  reset_value: 0x83
  description: Auxiliary interface configuration register
  fields:
    aux_rd_burst:
      base: uint
      start: 0
      end: 2
      description: Burst data length
      conversion:
        name: aux_burst_length
        bl1:
          value: 0x00
          description: Burst length 1
        bl2:
          value: 0x01
          description: Burst length 2
        bl6:
          value: 0x02
          description: Burst length 6
        bl8:
          value: 0x03
          description: Burst length 8
    man_rd_burst:
      base: uint
      start: 2
      end: 4
      description: Manual burst data length
      conversion:
        name: man_burst_length
        bl1:
          value: 0x00
          description: Burst length 1
        bl2:
          value: 0x01
          description: Burst length 2
        bl6:
          value: 0x02
          description: Burst length 6
        bl8:
          value: 0x03
          description: Burst length 8
    aux_fcu_write_en:
      base: bool
      start: 6
      description: Enables FCU write command on AUX IF for auxiliary sensors that need a trigger
    aux_manual_en:
      base: bool
      start: 7
      description: Switches auxiliary interface between automatic and manual mode

aux_rd_addr:
  type: register
  address: 0x4D
  access: RW
  size_bits: 8
  reset_value: 0x42
  description: Auxiliary interface read address
  fields:
    read_addr:
      base: uint
      start: 0
      end: 8
      description: Address to read. In manual mode it triggers the read operation

aux_wr_addr:
  type: register
  address: 0x4E
  access: RW
  size_bits: 8
  reset_value: 0x4C
  description: Auxiliary interface write address
  fields:
    write_addr:
      base: uint
      start: 0
      end: 8
      description: Address to write. In manual mode it triggers the write operation

aux_wr_data:
  type: register
  address: 0x4F
  access: RW
  size_bits: 8
  reset_value: 0x02
  description: Auxiliary interface write data
  fields:
    write_data:
      base: uint
      start: 0
      end: 8
      description: Data to write

err_reg_msk:
  type: register
  address: 0x52
  access: RW
  size_bits: 8
  description: Defines which error flag will trigger the error interrupt
  fields:
    fatal_err:
      base: bool
      start: 0
      description: Use fatal error to generate the error interrupt
    internal_err:
      base: uint
      start: 1
      end: 5
      description: Use internal error to generate the error interrupt
    fifo_err:
      base: bool
      start: 6
      description: Use fifo error to generate the error interrupt
    aux_err:
      base: bool
      start: 7
      description: Use aux interface error to generate the error interrupt

int1_io_ctrl:
  type: register
  address: 0x53
  access: RW
  size_bits: 8
  description: Configure the electrical behavior of the interrupt pin INT1
  fields:
    lvl:
      base: uint
      start: 1
      end: 2
      description: Configure output level of pin
      conversion:
        name: int_pin_level
        active_low: 0x00
        active_high: 0x01
    od:
      base: uint
      start: 2
      end: 3
      description: Configure output behaviour of pin
      conversion:
        name: int_pin_od
        push_pull: 0x00
        open_drain: 0x01
    output_en:
      base: bool
      start: 3
      description: Output enable for pin
    input_en:
      base: bool
      start: 4
      description: Input enable for pin

int2_io_ctrl:
  type: ref
  target: int1_io_ctrl
  description: Configure the electrical behavior of the interrupt pin INT2
  override:
    address: 0x54
    type: register

int_latch:
  type: register
  address: 0x55
  access: RW
  size_bits: 8
  description: Configure interrupt latch modes
  fields:
    int_latch:
      base: uint
      start: 0
      end: 1
      description: Latched/non-latched interrupt modes
      conversion:
        name: latch_mode
        none:
          value: 0x00
          description: Non latched
        permanent:
          value: 0x01
          description: Permanent latched

int1_map_feat:
  type: register
  address: 0x56
  access: RW
  size_bits: 8
  description: Interrupt/Feature mapping on INT1
  fields:
    sig_motion_out:
      base: bool
      start: 0
      description: Sigmotion output
    step_counter_out:
      base: bool
      start: 1
      description: Step-counter watermark or Step-detector output
    activity_out:
      base: bool
      start: 2
      description: Step activity output
    wrist_wear_wakeup_out:
      base: bool
      start: 3
      description: Wrist wear wakeup output
    wrist_gesture_out:
      base: bool
      start: 4
      description: Wrist gesture output
    no_motion_out:
      base: bool
      start: 5
      description: No motion detection output
    any_motion_out:
      base: bool
      start: 6
      description: Any motion detection output

int2_map_feat:
  type: ref
  target: int1_map_feat
  description: Interrupt/Feature mapping on INT2
  override:
    address: 0x57
    type: register

int_map_data:
  type: register
  address: 0x58
  access: RW
  size_bits: 8
  description: Data Interrupt mapping of both INT pins
  fields:
    ffull_int1:
      base: bool
      start: 0
      description: FIFO Full interrupt mapped to INT1
    fwm_int1:
      base: bool
      start: 1
      description: FIFO Watermark interrupt mapped to INT1
    drdy_int1:
      base: bool
      start: 2
      description: Data Ready interrupt mapped to INT1
    err_int1:
      base: bool
      start: 3
      description: Error interrupt mapped to INT1
    ffull_int2:
      base: bool
      start: 4
      description: FIFO Full interrupt mapped to INT2
    fwm_int2:
      base: bool
      start: 5
      description: FIFO Watermark interrupt mapped to INT2
    drdy_int2:
      base: bool
      start: 6
      description: Data Ready interrupt mapped to INT2
    err_int2:
      base: bool
      start: 7
      description: Error interrupt mapped to INT2

init_ctrl:
  type: register
  address: 0x59
  access: RW
  size_bits: 8
  description: Start initialization
  fields:
    init_ctrl:
      base: uint
      start: 0
      end: 8
      description: Start initialization

init_addr:
  type: register
  address: 0x5B
  access: RW
  size_bits: 16
  description: |
    Base address of the initialization data. Increment by burst write length in bytes/2 after each burst write
    operation. Please ignore, if your host supports to load the initialization data in a single 8kB burst write operation.
  fields:
    init_addr0:
      base: uint
      start: 0
      end: 4
      description: Base address for initialization data
    init_addr1:
      base: uint
      start: 8
      end: 16
      description: Base address for initialization data

init_data:
  type: buffer
  address: 0x5E
  access: RW
  description: Register for initialization data

internal_error:
  type: register
  address: 0x5F
  access: RO
  size_bits: 8
  description: Internal error flags
  fields:
    int_err_1:
      base: bool
      start: 1
      description: Internal error flag - long processing time, processing halted
    int_err_2:
      base: bool
      start: 2
      description: Internal error flag - fatal error, processing halted
    feat_eng_disabled:
      base: bool
      start: 4
      description: Feature engine has been disabled by host during sensor operation

aux_if_trim:
  type: register
  address: 0x68
  access: RW
  size_bits: 8
  reset_value: 0x01
  description: Auxiliary interface trim register (NVM backed)
  fields:
    asda_pupsel:
      base: uint
      start: 0
      end: 2
      description: Pullup configuration for ASDA
      conversion:
        name: asda_pullup
        pup_res_off:
          value: 0x00
          description: Pullup off
        pup_res_40k:
          value: 0x01
          description: Pullup 40k
        pup_res_10k:
          value: 0x02
          description: Pullup 10k
        pup_res_2k:
          value: 0x03
          description: Pullup 2k

gyr_crt_conf:
  type: register
  address: 0x69
  access: RW
  size_bits: 8
  description: Component Retrimming for Gyroscope
  fields:
    crt_running:
      base: uint
      start: 2
      end: 3
      description: Indicates that CRT is currently running
      conversion:
        name: crt_running
        disabled:
          value: 0x00
          description: Disabled
        enabled:
          value: 0x01
          description: Enabled
    rdy_for_dl:
      base: uint
      start: 3
      end: 4
      description: Pacemaker bit for downloading the CRT data
      conversion:
        name: rdy_for_dl
        ongoing:
          value: 0x00
          description: Ongoing or not started
        complete:
          value: 0x01
          description: Complete

nvm_conf:
  type: register
  address: 0x6A
  access: RW
  size_bits: 8
  description: NVM Configuration
  fields:
    nvm_prog_en:
      base: uint
      start: 1
      end: 2
      description: Enable NVM programming
      conversion:
        name: nvm_prog_en
        disable:
          value: 0x00
          description: Disable
        enable:
          value: 0x01
          description: Enable

if_conf:
  type: register
  address: 0x6B
  access: RW
  size_bits: 8
  description: Serial interface settings
  fields:
    spi3:
      base: uint
      start: 0
      end: 1
      description: Configure SPI Interface Mode for primary interface
      conversion:
        name: spi_mode
        spi4:
          value: 0x00
          description: SPI 4-wire mode
        spi3:
          value: 0x01
          description: SPI 3-wire mode
    spi3_ois:
      base: uint
      start: 1
      end: 2
      description: Configure SPI Interface Mode for OIS interface
      conversion:
        name: spi_mode_ois
        spi4:
          value: 0x00
          description: SPI 4-wire mode
        spi3:
          value: 0x01
          description: SPI 3-wire mode
    ois_en:
      base: bool
      start: 4
      description: Interface configuration - OIS enable bit
    aux_en:
      base: bool
      start: 5
      description: Interface configuration - AUX enable bit

drv:
  type: register
  address: 0x6C
  access: RW
  size_bits: 8
  reset_value: 0xAA
  description: Drive strength control register (NVM backed)
  fields:
    io_pad_drv1:
      base: uint
      start: 0
      end: 3
      description: Output pad drive strength setting for the SDO and SDx pins
    io_pad_i2c_b1:
      base: bool
      start: 3
      description: Disable additional pull down strength of SDx pin in I2C mode
    io_pad_drv2:
      base: uint
      start: 4
      end: 7
      description: Output pad drive strength setting for OSDO, ASCx, and ASDx pins
    io_pad_i2c_b2:
      base: bool
      start: 7
      description: Disable additional pull down strength of ASCx and ASDx pins in I2C mode

acc_self_test:
  type: register
  address: 0x6D
  access: RW
  size_bits: 8
  description: Settings for the accelerometer self-test configuration and trigger
  fields:
    acc_self_test_en:
      base: uint
      start: 0
      end: 1
      description: Enable accelerometer self-test
      conversion:
        name: acc_self_test_en
        disabled:
          value: 0x00
          description: Disabled
        enabled:
          value: 0x01
          description: Enabled
    acc_self_test_sign:
      base: uint
      start: 2
      end: 3
      description: Select sign of self-test excitation
      conversion:
        name: acc_self_test_sign
        negative:
          value: 0x00
          description: Negative
        positive:
          value: 0x01
          description: Positive
    acc_self_test_amp:
      base: uint
      start: 3
      end: 4
      description: Select amplitude of the selftest deflection
      conversion:
        name: acc_self_test_amp
        low:
          value: 0x00
          description: Low
        high:
          value: 0x01
          description: High

gyr_self_test_axes:
  type: register
  address: 0x6E
  access: RO
  size_bits: 8
  description: Settings for the gyroscope AXES self-test configuration and trigger
  fields:
    gyr_st_axes_done:
      base: bool
      start: 0
      description: STATUS - functional test of detection channels finished
    gyr_axis_x_ok:
      base: bool
      start: 1
      description: Status of gyro X-axis self test
    gyr_axis_y_ok:
      base: bool
      start: 2
      description: Status of gyro Y-axis self test
    gyr_axis_z_ok:
      base: bool
      start: 3
      description: Status of gyro Z-axis self test

nv_conf:
  type: register
  address: 0x70
  access: RW
  size_bits: 8
  description: NVM backed configuration bits
  fields:
    spi_en:
      base: uint
      start: 0
      end: 1
      description: Disable I2C and enable SPI for primary interface
      conversion:
        name: spi_en
        disabled:
          value: 0x00
          description: I2C enabled
        enabled:
          value: 0x01
          description: I2C disabled
    i2c_wdt_sel:
      base: uint
      start: 1
      end: 2
      description: Select timer period for I2C Watchdog
      conversion:
        name: i2c_wdt_sel
        short:
          value: 0x00
          description: I2C watchdog timeout after 1.25ms
        long:
          value: 0x01
          description: I2C watchdog timeout after 40ms
    i2c_wdt_en:
      base: uint
      start: 2
      end: 3
      description: I2C Watchdog at the SDA pin in I2C interface mode
      conversion:
        name: i2c_wdt_en
        disable:
          value: 0x00
          description: Disable I2C watchdog
        enable:
          value: 0x01
          description: Enable I2C watchdog
    acc_off_en:
      base: uint
      start: 3
      end: 4
      description: Add offset to filtered and unfiltered Accelerometer data
      conversion:
        name: acc_off_en
        disabled:
          value: 0x00
          description: Disabled
        enabled:
          value: 0x01
          description: Enabled

offset_0:
  type: register
  address: 0x71
  access: RW
  size_bits: 8
  description: Offset compensation for Accelerometer X-axis (NVM backed)
  fields:
    off_acc_x:
      base: uint
      start: 0
      end: 8
      description: Accelerometer offset compensation (X-axis)

offset_1:
  type: register
  address: 0x72
  access: RW
  size_bits: 8
  description: Offset compensation for Accelerometer Y-axis (NVM backed)
  fields:
    off_acc_y:
      base: uint
      start: 0
      end: 8
      description: Accelerometer offset compensation (Y-axis)

offset_2:
  type: register
  address: 0x73
  access: RW
  size_bits: 8
  description: Offset compensation for Accelerometer Z-axis (NVM backed)
  fields:
    off_acc_z:
      base: uint
      start: 0
      end: 8
      description: Accelerometer offset compensation (Z-axis)

offset_3:
  type: register
  address: 0x74
  access: RW
  size_bits: 8
  description: Offset compensation for Gyroscope X-axis (NVM backed)
  fields:
    gyr_usr_off_x_7_0:
      base: uint
      start: 0
      end: 8
      description: Gyroscope offset compensation (X-axis)

offset_4:
  type: register
  address: 0x75
  access: RW
  size_bits: 8
  description: Offset compensation for Gyroscope Y-axis (NVM backed)
  fields:
    gyr_usr_off_y_7_0:
      base: uint
      start: 0
      end: 8
      description: Gyroscope offset compensation (Y-axis)

offset_5:
  type: register
  address: 0x76
  access: RW
  size_bits: 8
  description: Offset compensation for Gyroscope Z-axis (NVM backed)
  fields:
    gyr_usr_off_z_7_0:
      base: uint
      start: 0
      end: 8
      description: Gyroscope offset compensation (Z-axis)

offset_6:
  type: register
  address: 0x77
  access: RW
  size_bits: 8
  description: Offset compensation (MSBs gyroscope, enables) (NVM backed)
  fields:
    gyr_usr_off_x_9_8:
      base: uint
      start: 0
      end: 2
      description: Gyroscope offset compensation (X-axis)
    gyr_usr_off_y_9_8:
      base: uint
      start: 2
      end: 4
      description: Gyroscope offset compensation (Y-axis)
    gyr_usr_off_z_9_8:
      base: uint
      start: 4
      end: 6
      description: Gyroscope offset compensation (Z-axis)
    gyr_off_en:
      base: uint
      start: 6
      end: 7
      description: Add offset to filtered and unfiltered Gyroscope data
      conversion:
        name: gyr_off_en
        disabled:
          value: 0x00
          description: Disabled
        enabled:
          value: 0x01
          description: Enabled
    gyr_gain_en:
      base: uint
      start: 7
      end: 8
      description: Compensate the gain as described in Sensitivity Error Compensation
      conversion:
        name: gyr_gain_en
        disabled:
          value: 0x00
          description: Disabled
        enabled:
          value: 0x01
          description: Enabled

pwr_conf:
  type: register
  address: 0x7C
  access: RW
  size_bits: 8
  reset_value: 0x03
  description: Power mode configuration register
  fields:
    adv_power_save:
      base: bool
      start: 0
      description: Advanced power mode enabled
    fifo_self_wake_up:
      base: bool
      start: 1
      description: FIFO read enabled in low power mode after FIFO interrupt is fired
    fup_en:
      base: bool
      start: 2
      description: Fast power up enabled

pwr_ctrl:
  type: register
  address: 0x7D
  access: RW
  size_bits: 8
  description: Power mode control register
  fields:
    aux_en:
      base: bool
      start: 0
      description: Enables the Auxiliary sensor
    gyr_en:
      base: bool
      start: 1
      description: Enables the Gyroscope
    acc_en:
      base: bool
      start: 2
      description: Enables the Accelerometer
    temp_en:
      base: bool
      start: 3
      description: Enables the Temperature sensor

cmd:
  type: register
  address: 0x7E
  access: WO
  size_bits: 8
  description: Command register
  fields:
    cmd:
      base: uint
      start: 0
      end: 8
      description: Executes a command
      try_conversion:
        name: Command
        g_trigger:
          value: 0x02
          description: Trigger special gyro operations
        usr_gain:
          value: 0x03
          description: Applies new gyro gain value
        nvm_prog:
          value: 0xa0
          description: Writes the NVM backed registers into NVM
        fifo_flush:
          value: 0xb0
          description: Clears FIFO content
        softreset:
          value: 0xb6
          description: |
            Triggers a reset, all user configuration
            settings are overwritten with their
            default state
